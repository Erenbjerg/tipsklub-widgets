<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tur Galleri</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; 
      background: transparent;
      font-family: sans-serif;
    }

    .wrap {
      width: 100%; padding: 10px;
      display: flex; justify-content: center;
    }

    /* Gitteret til billederne */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      width: 100%; max-width: 1000px;
    }

    /* Firkantede kasser til oversigten */
    .photo-wrap {
      aspect-ratio: 1 / 1; 
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(197, 160, 89, 0.4);
      cursor: pointer;
      background: #222;
      transition: all 0.2s ease;
    }

    .photo-wrap:hover {
      border-color: #C5A059;
      transform: scale(1.03);
    }

    .photo {
      width: 100%; height: 100%;
      object-fit: cover; 
    }

    /* --- POPUP (Når man klikker) --- */
    .modal {
      display: none; 
      position: fixed; z-index: 1000;
      left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center; align-items: center;
      padding: 15px;
    }

    .modal img {
      max-width: 100%; max-height: 95vh;
      border-radius: 6px;
      border: 2px solid #C5A059;
    }

    .close-btn {
      position: absolute; top: 15px; right: 25px;
      color: #C5A059; font-size: 40px; font-weight: bold;
      cursor: pointer; background: none; border: none;
    }

    .loading { color: #888; text-align: center; width: 100%; grid-column: 1 / -1; padding: 20px;}
  </style>
</head>
<body>

  <div class="wrap">
    <div id="gallery" class="gallery-grid">
      <div class="loading">Henter billeder... 📸</div>
    </div>
  </div>

  <div id="imageModal" class="modal">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <img id="modalImage" src="" alt="Fuld størrelse">
  </div>

<script>
  // Opsætning: Henter fra mappen "billeder" i main
  const GITHUB_USER = "erenbjerg";
  const GITHUB_REPO = "tipsklub-widgets";
  const FOLDER_NAME = "billeder"; 

  const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_NAME}`;
  const gallery = document.getElementById("gallery");

  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImage");

  function openModal(imgUrl) {
    modalImg.src = imgUrl;
    modal.style.display = "flex";
  }

  function closeModal() {
    modal.style.display = "none";
    modalImg.src = "";
  }

  modal.addEventListener('click', function(e) {
    if (e.target === modal) { closeModal(); }
  });

  fetch(API_URL)
    .then(r => r.json())
    .then(files => {
      if(files.message === "Not Found") {
        gallery.innerHTML = "<div class='loading'>Kunne ikke finde mappen.</div>";
        return;
      }

      const allowedExts = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
      const images = files.filter(f => {
        if (f.type !== "file") return false;
        const ext = f.name.split('.').pop().toLowerCase();
        return allowedExts.includes(ext);
      });

      if (images.length === 0) {
        gallery.innerHTML = "<div class='loading'>Ingen billeder i mappen endnu.</div>";
        return;
      }

      gallery.innerHTML = images.map(file => `
        <div class="photo-wrap" onclick="openModal('${file.download_url}')">
          <img src="${file.download_url}" class="photo" loading="lazy">
        </div>
      `).join("");
    })
    .catch(e => {
      gallery.innerHTML = "<div class='loading'>Fejl ved indlæsning.</div>";
      console.error(e);
    });
</script>

</body>
</html>
