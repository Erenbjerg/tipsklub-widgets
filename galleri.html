<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tur Karrusel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      font-family: sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100%; width: 100%;
      overflow: hidden;
    }

    .wrap {
      width: 100%; 
      max-width: 900px; /* Max bredde på computer */
      padding: 10px;
    }

    /* Karrusel Containeren */
    .carousel {
      position: relative;
      width: 100%;
      height: 450px; /* Højden på diasshowet - kan rettes! */
      border-radius: 12px;
      border: 2px solid #C5A059;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      background: #111;
    }

    /* Sporet som billederne ligger på (den der glider) */
    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.6s ease-in-out; /* Den bløde glide-animation */
    }

    /* Selve billedet */
    .slide {
      min-width: 100%;
      height: 100%;
      object-fit: cover; /* Sørger for at billedet fylder rammen ud uden at blive mast */
    }

    /* Knapper til frem/tilbage */
    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(20, 20, 20, 0.6);
      color: #C5A059;
      border: 1px solid rgba(197, 160, 89, 0.5);
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 24px; font-weight: bold;
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .btn:hover {
      background: rgba(197, 160, 89, 0.9);
      color: #000;
    }

    .btn-prev { left: 10px; }
    .btn-next { right: 10px; }

    .loading { 
      color: #C5A059; text-align: center; width: 100%; 
      position: absolute; top: 50%; transform: translateY(-50%);
      font-style: italic; font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="carousel" id="carousel-container">
      <div class="loading" id="loader">Henter billeder... 📸</div>
      
      <button class="btn btn-prev" id="prevBtn" style="display:none;">&#10094;</button>
      <button class="btn btn-next" id="nextBtn" style="display:none;">&#10095;</button>

      <div class="carousel-track" id="track"></div>
    </div>
  </div>

<script>
  // Opsætning
  const GITHUB_USER = "erenbjerg";
  const GITHUB_REPO = "tipsklub-widgets";
  const FOLDER_NAME = "billeder"; 
  const AUTO_PLAY_SPEED = 4000; // 4000 millisekunder = 4 sekunder pr. billede

  const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_NAME}`;
  
  const track = document.getElementById("track");
  const loader = document.getElementById("loader");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const carouselContainer = document.getElementById("carousel-container");

  let slidesCount = 0;
  let currentIndex = 0;
  let autoPlayInterval;

  // Hent billeder fra GitHub
  fetch(API_URL)
    .then(r => r.json())
    .then(files => {
      if(files.message === "Not Found") {
        loader.innerText = "Kunne ikke finde mappen.";
        return;
      }

      const allowedExts = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
      const images = files.filter(f => {
        if (f.type !== "file") return false;
        const ext = f.name.split('.').pop().toLowerCase();
        return allowedExts.includes(ext);
      });

      if (images.length === 0) {
        loader.innerText = "Ingen billeder i mappen endnu.";
        return;
      }

      // Fjern loading tekst og vis knapper
      loader.style.display = "none";
      if(images.length > 1) {
        prevBtn.style.display = "flex";
        nextBtn.style.display = "flex";
      }

      slidesCount = images.length;

      // Byg billederne ind i sporet
      track.innerHTML = images.map(file => `
        <img src="${file.download_url}" class="slide" loading="lazy">
      `).join("");

      // Start karrusellen
      startAutoPlay();

    })
    .catch(e => {
      loader.innerText = "Fejl ved indlæsning.";
      console.error(e);
    });

  // Karrusel Logik
  function moveToSlide(index) {
    if (index < 0) {
      currentIndex = slidesCount - 1; // Gå til sidste billede, hvis vi er ved det første
    } else if (index >= slidesCount) {
      currentIndex = 0; // Gå tilbage til start, hvis vi er ved det sidste
    } else {
      currentIndex = index;
    }
    
    // Ryk sporet til venstre baseret på index (100% pr. billede)
    track.style.transform = `translateX(-${currentIndex * 100}%)`;
  }

  // Knap funktioner
  prevBtn.addEventListener('click', () => {
    moveToSlide(currentIndex - 1);
    resetAutoPlay(); // Genstart timeren, når man klikker manuelt
  });

  nextBtn.addEventListener('click', () => {
    moveToSlide(currentIndex + 1);
    resetAutoPlay();
  });

  // Auto-play funktioner
  function startAutoPlay() {
    autoPlayInterval = setInterval(() => {
      moveToSlide(currentIndex + 1);
    }, AUTO_PLAY_SPEED);
  }

  function resetAutoPlay() {
    clearInterval(autoPlayInterval);
    startAutoPlay();
  }

  // Sæt på pause når musen holdes over karrusellen
  carouselContainer.addEventListener('mouseenter', () => clearInterval(autoPlayInterval));
  carouselContainer.addEventListener('mouseleave', startAutoPlay);

</script>
</body>
</html>
